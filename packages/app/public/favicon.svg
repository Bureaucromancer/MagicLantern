<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SPDX-License-Identifier: MIT
       Copyright (C) 2026 Magic Lantern contributors -->
  <!-- A lantern: a ring to hang it by, a frame, and the light inside. The frame
       follows the colour scheme, so the icon reads on light and dark tab bars. -->
  <style>
    .frame { fill: none; stroke: #312e81; stroke-width: 2.5; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #c7d2fe; }
    }
  </style>
  <circle class="frame" cx="16" cy="4.5" r="2.5" />
  <rect class="frame" x="7" y="8" width="18" height="21" rx="4" />
  <circle cx="16" cy="18.5" r="5.5" fill="#f59e0b" />
</svg>
